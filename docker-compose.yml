version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: unifyhr-mysql-1
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    networks:
      - unifyhr-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  adminer:
    image: adminer:latest
    container_name: unifyhr-adminer-1
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - unifyhr-net

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: unifyhr-auth-service
    restart: unless-stopped
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:8081"
    environment:
      SERVER_PORT: 8081
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - unifyhr-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  employee-service:
    build:
      context: ./employee-service
      dockerfile: Dockerfile
    container_name: unifyhr-employee-service
    restart: unless-stopped
    ports:
      - "${EMPLOYEE_SERVICE_PORT:-8082}:8082"
    environment:
      SERVER_PORT: 8082
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      AUTH_SERVICE_URL: http://auth-service:8081
    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - unifyhr-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  attendance-service:
    build:
      context: ./attendance-service
      dockerfile: Dockerfile
    container_name: unifyhr-attendance-service
    restart: unless-stopped
    ports:
      - "${ATTENDANCE_SERVICE_PORT:-8083}:8083"
    environment:
      SERVER_PORT: 8083
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      AUTH_SERVICE_URL: http://auth-service:8081
      EMPLOYEE_SERVICE_URL: http://employee-service:8082
    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      employee-service:
        condition: service_healthy
    networks:
      - unifyhr-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  payroll-service:
    build:
      context: ./payroll-service
      dockerfile: Dockerfile
    container_name: unifyhr-payroll-service
    restart: unless-stopped
    ports:
      - "${PAYROLL_SERVICE_PORT:-8084}:8084"
    environment:
      SERVER_PORT: 8084
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      AUTH_SERVICE_URL: http://auth-service:8081
      EMPLOYEE_SERVICE_URL: http://employee-service:8082
      ATTENDANCE_SERVICE_URL: http://attendance-service:8083
    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      attendance-service:
        condition: service_healthy
      employee-service:
        condition: service_healthy
    networks:
      - unifyhr-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: unifyhr-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      auth-service:
        condition: service_healthy
      employee-service:
        condition: service_healthy
      attendance-service:
        condition: service_healthy
      payroll-service:
        condition: service_healthy
    networks:
      - unifyhr-net

volumes:
  mysql_data:

networks:
  unifyhr-net:
    driver: bridge

