name: UnifyHR CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    name: Test & JaCoCo Coverage Check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - employee-service
          - attendance-service
          - payroll-service
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x ./${{ matrix.service }}/mvnw

      - name: Run JUnit Tests & JaCoCo Coverage Check (Linux/macOS)
        if: runner.os != 'Windows'
        working-directory: ./${{ matrix.service }}
        run: ./mvnw clean test jacoco:report jacoco:check

      - name: Run JUnit Tests & JaCoCo Coverage Check (Windows)
        if: runner.os == 'Windows'
        working-directory: ./${{ matrix.service }}
        shell: powershell
        run: .\mvnw.cmd clean test jacoco:report jacoco:check

      - name: Upload JaCoCo Test Report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-${{ matrix.service }}
          path: ./${{ matrix.service }}/target/site/jacoco

  build-and-push:
    name: Docker Build & Optional Push
    needs: test-and-verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - employee-service
          - attendance-service
          - payroll-service
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: runner.os != 'Windows'
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Hub Credentials
        if: runner.os != 'Windows'
        id: docker_hub_check
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Hub
        if: runner.os != 'Windows' && steps.docker_hub_check.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check GHCR Token
        if: runner.os != 'Windows'
        id: ghcr_check
        run: |
          if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GitHub Container Registry (GHCR)
        if: runner.os != 'Windows' && steps.ghcr_check.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build Docker image (Windows runner)
        if: runner.os == 'Windows'
        shell: powershell
        run: docker build -t unifyhr-${{ matrix.service }}:latest ./${{ matrix.service }}

      - name: Build and (Optionally) Push Docker Image (Linux runner)
        if: runner.os != 'Windows'
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: ${{ steps.docker_hub_check.outputs.configured == 'true' || steps.ghcr_check.outputs.configured == 'true' }}
          tags: ${{ steps.docker_hub_check.outputs.configured == 'true' && format('{0}/unifyhr-{1}:latest', secrets.DOCKERHUB_USERNAME, matrix.service) || format('unifyhr-{0}:latest', matrix.service) }}
          load: ${{ steps.docker_hub_check.outputs.configured != 'true' && steps.ghcr_check.outputs.configured != 'true' }}
