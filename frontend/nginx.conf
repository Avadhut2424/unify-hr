server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/auth/ {
        proxy_pass http://auth-service:8081/auth/;
    }

    location /api/employees {
        proxy_pass http://employee-service:8082/employees;
    }

    location /api/attendance/ {
        proxy_pass http://attendance-service:8083/attendance/;
    }

    location /api/payroll/ {
        proxy_pass http://payroll-service:8084/payroll/;
    }

    location /api/health/auth {
        proxy_pass http://auth-service:8081/actuator/health;
    }

    location /api/health/employee {
        proxy_pass http://employee-service:8082/actuator/health;
    }

    location /api/health/attendance {
        proxy_pass http://attendance-service:8083/actuator/health;
    }

    location /api/health/payroll {
        proxy_pass http://payroll-service:8084/actuator/health;
    }
}
