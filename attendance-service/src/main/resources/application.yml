server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: attendance-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/attendance_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:rootpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

auth:
  service:
    url: ${AUTH_SERVICE_URL:http://auth-service:8081}

employee:
  service:
    url: ${EMPLOYEE_SERVICE_URL:http://employee-service:8082}

attendance:
  absentee-job:
    cron: ${ABSENTEE_CRON:0 0 23 * * *}
    thread-pool-size: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

